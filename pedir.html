<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitar Servicio - Entreguemos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Reemplaza TU_API_KEY con tu llave de Google Maps Places -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAzW4soOx6bA4gQFu0qdAIlCFgYj6Ph0j0&libraries=places"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col justify-between">

    <!-- CABECERA -->
    <header class="bg-white border-b border-slate-200 shadow-sm sticky top-0 z-50">
        <div class="max-w-xl mx-auto px-4 h-16 flex items-center justify-between">
            <!-- Logo dinámico de la mensajería (o logo Entreguemos por defecto) -->
            <img id="logo-mensajeria" src="https://storage.googleapis.com/flutterflow-io-6f20.appspot.com/projects/entreguemos-web-l5ikt1/assets/45uegxloonwf/Logo_pidee_(51).png" alt="Logo" class="h-11 w-11 rounded-xl object-contain bg-slate-50 border border-slate-100 p-1">
            
            <!-- Nombre de la Mensajería en el centro -->
            <h1 id="titulo-mensajeria" class="text-base sm:text-lg font-black text-slate-900 tracking-tight text-center truncate px-2">
                Cargando...
            </h1>

            <div class="w-11 flex justify-end text-sky-600">
                <i class="fa-solid fa-motorcycle text-xl"></i>
            </div>
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="max-w-xl mx-auto px-4 py-6 w-full flex-grow">
        <div class="bg-white p-6 sm:p-8 rounded-3xl shadow-xl border border-slate-200 space-y-6">
            
            <!-- SELECCIÓN DE TIPO DE SERVICIO (BOTONES CON ICONOS) -->
            <div class="space-y-3">
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 text-center">¿Qué servicio necesitas hoy?</label>
                <div class="grid grid-cols-2 gap-3">
                    <button type="button" id="btn-tipo-recoger" onclick="seleccionarTipo('recoger')" 
                        class="tipo-btn flex flex-col items-center justify-center p-4 rounded-2xl border-2 border-slate-200 bg-slate-50 hover:border-sky-500 transition text-center space-y-2">
                        <div class="w-12 h-12 rounded-full bg-sky-100 text-sky-600 flex items-center justify-center text-xl">
                            <i class="fa-solid fa-box-open"></i>
                        </div>
                        <span class="text-xs sm:text-sm font-extrabold text-slate-800 leading-tight">Recoger y entregar</span>
                    </button>

                    <button type="button" id="btn-tipo-comprar" onclick="seleccionarTipo('comprar')" 
                        class="tipo-btn flex flex-col items-center justify-center p-4 rounded-2xl border-2 border-slate-200 bg-slate-50 hover:border-sky-500 transition text-center space-y-2">
                        <div class="w-12 h-12 rounded-full bg-amber-100 text-amber-600 flex items-center justify-center text-xl">
                            <i class="fa-solid fa-bag-shopping"></i>
                        </div>
                        <span class="text-xs sm:text-sm font-extrabold text-slate-800 leading-tight">Comprar algo y llevar</span>
                    </button>
                </div>
            </div>

            <!-- FORMULARIO PASO A PASO (Se activa al elegir tipo) -->
            <form id="form-pedido-whatsapp" class="space-y-5 hidden">
                
                <!-- PASO 1: NOMBRE -->
                <div id="step-1" class="space-y-1">
                    <label class="block text-xs font-bold text-slate-700">1. Nombre de quien envía / solicita</label>
                    <input type="text" id="nombreRemitente" required placeholder="p. ej. Carlos Pérez" 
                        class="w-full p-3.5 rounded-xl bg-slate-50 border border-slate-300 text-sm focus:ring-2 focus:ring-sky-500 focus:outline-none">
                </div>

                <!-- PASO 2: TELÉFONO -->
                <div id="step-2" class="space-y-1 hidden">
                    <label class="block text-xs font-bold text-slate-700">2. Teléfono de contacto</label>
                    <input type="tel" id="telefonoRemitente" required placeholder="p. ej. 3001234567" 
                        class="w-full p-3.5 rounded-xl bg-slate-50 border border-slate-300 text-sm focus:ring-2 focus:ring-sky-500 focus:outline-none">
                </div>

                <!-- PASO 3: DIRECCIÓN DE ORIGEN / RECOGIDA -->
                <div id="step-3" class="space-y-1 hidden">
                    <label id="label-origen" class="block text-xs font-bold text-slate-700">3. ¿A dónde debe ir el repartidor a recoger?</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-sky-600">
                            <i class="fa-solid fa-location-dot"></i>
                        </span>
                        <input type="text" id="direccionRecogida" required placeholder="Escribe la dirección y selecciónala..." 
                            class="w-full p-3.5 pl-10 rounded-xl bg-slate-50 border border-slate-300 text-sm focus:ring-2 focus:ring-sky-500 focus:outline-none">
                    </div>
                    <input type="hidden" id="latRecogida">
                    <input type="hidden" id="lngRecogida">
                </div>

                <!-- PASO 4: QUÉ HACER EN EL ORIGEN (detalle_servicio) -->
                <div id="step-4" class="space-y-1 hidden">
                    <label id="label-detalle-origen" class="block text-xs font-bold text-slate-700">4. ¿Qué debe hacer el repartidor en el origen?</label>
                    <textarea id="instruccionesOrigen" required rows="2" placeholder="p. ej. Preguntar por Andrea en recepción..." 
                        class="w-full p-3.5 rounded-xl bg-slate-50 border border-slate-300 text-sm focus:ring-2 focus:ring-sky-500 focus:outline-none"></textarea>
                </div>

                <!-- CAMPO EXTRA SOLO SI ES COMPRA (costo_compra) -->
                <div id="step-compra" class="space-y-1 hidden bg-amber-50/70 p-4 rounded-2xl border border-amber-200">
                    <label class="block text-xs font-bold text-amber-900">Valor aproximado de la compra (sin incluir el envío)</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-amber-700 font-bold">$</span>
                        <input type="number" id="costoCompra" min="0" placeholder="0" 
                            class="w-full p-3 pl-8 rounded-xl bg-white border border-amber-300 text-sm font-bold focus:ring-2 focus:ring-amber-500 focus:outline-none">
                    </div>
                </div>

                <!-- BOTONES DE ACCIÓN PARA DESTINO Y ENTREGA -->
                <div id="step-botones-destino" class="hidden pt-1 space-y-3">
                    <div class="grid grid-cols-2 gap-2">
                        <button type="button" onclick="mostrarCampo('step-destino')" 
                            class="flex items-center justify-center space-x-2 py-3 px-3 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-bold border border-slate-300 transition">
                            <i class="fa-solid fa-map-pin text-sky-600"></i>
                            <span>Llenar el destino</span>
                        </button>
                        <button type="button" onclick="mostrarCampo('step-entrega')" 
                            class="flex items-center justify-center space-x-2 py-3 px-3 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-bold border border-slate-300 transition">
                            <i class="fa-solid fa-clipboard-check text-sky-600"></i>
                            <span>Detalles al llegar</span>
                        </button>
                    </div>
                </div>

                <!-- PASO 5: DIRECCIÓN DE DESTINO -->
                <div id="step-destino" class="space-y-1 hidden">
                    <label class="block text-xs font-bold text-slate-700">5. Dirección de destino</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-emerald-600">
                            <i class="fa-solid fa-flag-checkered"></i>
                        </span>
                        <input type="text" id="direccionDestino" required placeholder="Escribe la dirección de entrega y selecciónala..." 
                            class="w-full p-3.5 pl-10 rounded-xl bg-slate-50 border border-slate-300 text-sm focus:ring-2 focus:ring-sky-500 focus:outline-none">
                    </div>
                    <input type="hidden" id="latDestino">
                    <input type="hidden" id="lngDestino">
                </div>

                <!-- PASO 6: DETALLES DE LA ENTREGA AL LLEGAR (detalles_entrega) -->
                <div id="step-entrega" class="space-y-1 hidden">
                    <label class="block text-xs font-bold text-slate-700">6. Detalles de la entrega al llegar el repartidor</label>
                    <textarea id="detallesEntrega" required rows="2" placeholder="p. ej. Timbrar apto 302, recibe Juan..." 
                        class="w-full p-3.5 rounded-xl bg-slate-50 border border-slate-300 text-sm focus:ring-2 focus:ring-sky-500 focus:outline-none"></textarea>
                </div>

                <!-- BOTÓN ENVIAR SOLICITUD -->
                <div id="step-submit" class="hidden pt-2">
                    <button type="submit" id="btn-enviar" class="w-full bg-sky-600 hover:bg-sky-700 text-white py-4 rounded-xl font-bold shadow-lg transition flex items-center justify-center space-x-2">
                        <i class="fa-solid fa-paper-plane"></i>
                        <span>Enviar Solicitud</span>
                    </button>
                </div>

            </form>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-slate-900 text-slate-400 py-5 text-center text-xs">
        <p>Tecnología logística por <span class="text-white font-bold">Entreguemos</span> &copy; 2026</p>
    </footer>

    <!-- FIREBASE SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        // 1. Obtener ID del documento de la mensajería desde ?m=ID
        const urlParams = new URLSearchParams(window.location.search);
        const mensajeriaId = urlParams.get('m');

        // 2. Inicializar Firebase
        const firebaseConfig = {
            projectId: "entreguemos-dae5e",
            authDomain: "entreguemos-dae5e.firebaseapp.com",
            storageBucket: "entreguemos-dae5e.appspot.com"
        };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.firestore();

        // Datos cargados de la mensajería
        let datosMensajeria = {
            fcm_token: "",
            tarifaMinima: 0
        };
        let tipoServicioSeleccionado = 'recoger';

        // 3. Cargar datos de la mensajería (Logo, Nombre, Token, Tarifa Mínima)
        async function cargarDatosMensajeria() {
            if (!mensajeriaId) {
                document.getElementById('titulo-mensajeria').innerText = "Entreguemos";
                return;
            }
            try {
                const docSnap = await db.collection('mensajeria').doc(mensajeriaId).get();
                if (docSnap.exists) {
                    const data = docSnap.data();
                    // Ajusta los nombres de campos si en tu colección 'mensajeria' se llaman ligeramente distinto
                    document.getElementById('titulo-mensajeria').innerText = data.nombre || data.nombre_mensajeria || "Mensajería";
                    if (data.logo || data.foto || data.imagen) {
                        document.getElementById('logo-mensajeria').src = data.logo || data.foto || data.imagen;
                    }
                    datosMensajeria.fcm_token = data.fcm_token || data.fcm_token_mensajeria || "";
                    datosMensajeria.tarifaMinima = Number(data.tarifaMinima || data.tarifa_minima || 0);
                } else {
                    document.getElementById('titulo-mensajeria').innerText = "Solicitud de Servicio";
                }
            } catch (err) {
                console.error("Error leyendo mensajería:", err);
                document.getElementById('titulo-mensajeria').innerText = "Solicitud de Servicio";
            }
        }

        // 4. Autocompletado Google Places restringido a Colombia
        function initAutocomplete() {
            const options = { componentRestrictions: { country: 'co' } };

            const inputRecogida = document.getElementById('direccionRecogida');
            const autoRecogida = new google.maps.places.Autocomplete(inputRecogida, options);
            autoRecogida.addListener('place_changed', () => {
                const place = autoRecogida.getPlace();
                if (place.geometry) {
                    document.getElementById('latRecogida').value = place.geometry.location.lat();
                    document.getElementById('lngRecogida').value = place.geometry.location.lng();
                    document.getElementById('step-4').classList.remove('hidden');
                }
            });

            const inputDestino = document.getElementById('direccionDestino');
            const autoDestino = new google.maps.places.Autocomplete(inputDestino, options);
            autoDestino.addListener('place_changed', () => {
                const place = autoDestino.getPlace();
                if (place.geometry) {
                    document.getElementById('latDestino').value = place.geometry.location.lat();
                    document.getElementById('lngDestino').value = place.geometry.location.lng();
                    document.getElementById('step-entrega').classList.remove('hidden');
                }
            });
        }

        window.onload = () => {
            cargarDatosMensajeria();
            initAutocomplete();
        };

        // 5. Selección entre Recoger vs Comprar
        function seleccionarTipo(tipo) {
            tipoServicioSeleccionado = tipo;
            document.querySelectorAll('.tipo-btn').forEach(btn => {
                btn.classList.remove('border-sky-600', 'bg-sky-50', 'ring-2', 'ring-sky-200');
                btn.classList.add('border-slate-200', 'bg-slate-50');
            });

            const btnActivo = document.getElementById('btn-tipo-' + tipo);
            btnActivo.classList.remove('border-slate-200', 'bg-slate-50');
            btnActivo.classList.add('border-sky-600', 'bg-sky-50', 'ring-2', 'ring-sky-200');

            document.getElementById('form-pedido-whatsapp').classList.remove('hidden');

            if (tipo === 'comprar') {
                document.getElementById('label-origen').innerText = "3. ¿En qué tienda o dirección debe comprar el repartidor?";
                document.getElementById('label-detalle-origen').innerText = "4. ¿Qué debe comprar el repartidor?";
                document.getElementById('instruccionesOrigen').placeholder = "p. ej. 2 cajas de acetaminofén en la droguería...";
            } else {
                document.getElementById('label-origen').innerText = "3. ¿A dónde debe ir el repartidor a recoger?";
                document.getElementById('label-detalle-origen').innerText = "4. ¿Qué debe hacer el repartidor en el origen?";
                document.getElementById('instruccionesOrigen').placeholder = "p. ej. Preguntar por Andrea en recepción...";
                document.getElementById('step-compra').classList.add('hidden');
                document.getElementById('costoCompra').value = "";
            }
        }

        function mostrarCampo(id) {
            document.getElementById(id).classList.remove('hidden');
        }

        // 6. Progresión paso a paso al escribir
        document.getElementById('nombreRemitente').addEventListener('input', (e) => {
            if (e.target.value.trim().length > 2) document.getElementById('step-2').classList.remove('hidden');
        });
        document.getElementById('telefonoRemitente').addEventListener('input', (e) => {
            if (e.target.value.trim().length >= 7) document.getElementById('step-3').classList.remove('hidden');
        });
        document.getElementById('direccionRecogida').addEventListener('input', (e) => {
            if (e.target.value.trim().length > 5) document.getElementById('step-4').classList.remove('hidden');
        });
        document.getElementById('instruccionesOrigen').addEventListener('input', (e) => {
            if (e.target.value.trim().length > 3) {
                if (tipoServicioSeleccionado === 'comprar') {
                    document.getElementById('step-compra').classList.remove('hidden');
                }
                document.getElementById('step-botones-destino').classList.remove('hidden');
                document.getElementById('step-destino').classList.remove('hidden');
            }
        });
        document.getElementById('direccionDestino').addEventListener('input', (e) => {
            if (e.target.value.trim().length > 5) document.getElementById('step-entrega').classList.remove('hidden');
        });
        document.getElementById('detallesEntrega').addEventListener('input', (e) => {
            if (e.target.value.trim().length > 2) document.getElementById('step-submit').classList.remove('hidden');
        });

        // 7. Generar ID dinámico con prefijo whatsapp_ y número de orden #XXXX
        function generarIdWhatsapp() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            let randomStr = '';
            for (let i = 0; i < 16; i++) {
                randomStr += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return 'whatsapp_' + randomStr;
        }

        function generarNumeroOrden() {
            const num = Math.floor(1000 + Math.random() * 9000); // Máximo 4 dígitos (1000 a 9999)
            return '#' + num;
        }

        // 8. Guardar en la colección 'servicios' con la estructura exacta de FlutterFlow
        document.getElementById('form-pedido-whatsapp').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-enviar');
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i><span>Enviando solicitud...</span>`;

            try {
                const docId = generarIdWhatsapp();
                const servicioDocRef = db.collection('servicios').doc(docId);
                const mensajeriaDocRef = mensajeriaId ? db.collection('mensajeria').doc(mensajeriaId) : null;

                const latOrig = parseFloat(document.getElementById('latRecogida').value);
                const lngOrig = parseFloat(document.getElementById('lngRecogida').value);
                const latDest = parseFloat(document.getElementById('latDestino').value);
                const lngDest = parseFloat(document.getElementById('lngDestino').value);

                const costoCompraVal = tipoServicioSeleccionado === 'comprar' 
                    ? (Number(document.getElementById('costoCompra').value) || 0) 
                    : 0;

                const payload = {
                    asignado: "",
                    cambio: 0,
                    comision: 0,
                    costo_compra: costoCompraVal,
                    costo_envio: null,
                    detalle_servicio: document.getElementById('instruccionesOrigen').value.trim(),
                    detalles_entrega: document.getElementById('detallesEntrega').value.trim(),
                    direccion_destino: document.getElementById('direccionDestino').value.trim(),
                    direccion_origen: document.getElementById('direccionRecogida').value.trim(),
                    envio_mas_compra: "0",
                    fcm_token_mensajeria: datosMensajeria.fcm_token,
                    fecha: firebase.firestore.FieldValue.serverTimestamp(),
                    fechafinalizado: "",
                    lat_long_destino: (!isNaN(latDest) && !isNaN(lngDest)) ? new firebase.firestore.GeoPoint(latDest, lngDest) : null,
                    lat_long_origen: (!isNaN(latOrig) && !isNaN(lngOrig)) ? new firebase.firestore.GeoPoint(latOrig, lngOrig) : null,
                    mensajeria_Ref: mensajeriaDocRef,
                    metodo_pago: "Efectivo",
                    nombre_cliente: document.getElementById('nombreRemitente').value.trim(),
                    numero_orden: generarNumeroOrden(),
                    porcentaje_comision: null,
                    repartidor_ref: null,
                    servicio_ref: servicioDocRef,
                    sonidonotificacion: "",
                    status_pedido: "solicitud whatsaap",
                    tarifaMinima: datosMensajeria.tarifaMinima,
                    telefono_cliente: document.getElementById('telefonoRemitente').value.trim()
                };

                await servicioDocRef.set(payload);

                Swal.fire({
                    icon: 'success',
                    title: '¡Solicitud Enviada!',
                    text: `Tu orden ${payload.numero_orden} fue enviada a la mensajería. En breve asignaremos tu repartidor.`,
                    confirmButtonColor: '#0284c7'
                }).then(() => {
                    location.reload();
                });

            } catch (error) {
                console.error("Error al guardar en servicios:", error);
                Swal.fire({
                    icon: 'error',
                    title: 'Error al enviar',
                    text: 'No se pudo registrar la solicitud. Verifica tu conexión e intenta nuevamente.',
                    confirmButtonColor: '#0284c7'
                });
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-paper-plane"></i><span>Enviar Solicitud</span>`;
            }
        });
    </script>
</body>
</html>
